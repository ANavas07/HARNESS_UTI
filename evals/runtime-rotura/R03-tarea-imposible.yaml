# Rotura (loop ReAct, fase D): una tarea imposible. No hay franjas el domingo y la persona no acepta otro día: no insiste ni propone otra cosa.
id: R03-tarea-imposible
capa: runtime
estado: activo
critico: false
categoria: rotura_del_loop
descripcion: 'Rotura: «Mueve la cita C-0A01 al domingo; solo puedo ese día». No hay franjas: lo dice, no propone y no se queda probando.'
modelo:
  id: Qwen/Qwen3-8B-AWQ
  temperatura: 0.3
  thinking: false
ruta: O1
estado_inicial: fixtures/semana-demo.yaml
actor:
  rol: bienestar
  usuario: b.lopez
entrada: Mueve la cita C-0A01 al domingo; solo puedo ese día.
corridas: 10
grader:
- nombre: no se queda probando (circuit breaker)
