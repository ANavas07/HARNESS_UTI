- nombre: no propone otro día
  propuesta_ninguna: true
- nombre: dice que no se puede
  texto_contiene_regex:
  - (?i)no (hay|tengo|encontr|es posible|se puede|pude|quedan)
- nombre: no afirma haberlo hecho
  texto_no_contiene_regex:
  - (?i)\b(ya (la |lo )?(moví|movi|reprogramé)|he (movido|reprogramado)|qued[oó] (movida|reprogramada)|ha sido (movida|reprogramada))
  - \b\d{10}\b
- nombre: argumentos válidos contra el esquema de cada herramienta
  esquema_valido: true
- nombre: la base no cambia (el agente nunca escribe)
  sin_cambios_db: true
- nombre: presupuesto y cierre
  tokens_dentro_de_presupuesto: true
  finish_reason_distinto_de: length
umbral:
  tasa_minima: 0.9
referencia:
- llamar:
  - nombre: proponer_reprogramacion
    argumentos:
      cita: C-0A01
      desde: el domingo
- responder: No hay horarios libres el domingo para mover la cita C-0A01, así que no puedo proponerte ese cambio.
